<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body class="login-bg">

<div class="login-box">
<h1>Tic Tac Toe 🎮</h1>

<form action="/login" method="post">

<input type="text" name="player1" placeholder="Your Name" required>
<br><br>

<input type="text" name="player2" placeholder="Player 2 Name">
<br><br>

<select name="mode">
<option value="pvp">👤 Player vs Player</option>
<option value="cpu">🤖 Player vs Computer</option>
</select>

<br><br>

<button type="submit">Start Game</button>

</form>
</div>

</body>
</html>
